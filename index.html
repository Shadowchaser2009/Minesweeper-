--n1:#64b5f6;--n2:#81c784;--n3:#ef7676;--n4:#b39ddb;--n5:#ffab66;--n6:#4dd0e1;--n7:#e0e0e0;--n8:#a0a0a0}}

html,body{height:100%;margin:0}
html{background:var(--bar)}

:root{--ch:#c6cfde;--cr:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ch:#3e4658;--cr:#14171c}}

#th{flex:none;width:42px;border:0;border-radius:12px;background:rgba(255,255,255,.08);color:inherit;font-size:17px}
header{padding:6px 12px 8px;gap:8px}
.lv button{padding:7px 4px}
#face{width:48px;height:48px;font-size:25px}
.stat{font-size:22px}
footer{padding:8px 12px 10px}
.seg button{padding:12px 8px}
#zm{width:auto;min-width:52px;height:48px;padding:0 12px;font-size:16px;font-weight:700;border-radius:16px}
#bw{padding:6px}
#pg{height:3px;background:var(--ln);flex:none}

.stat.neg{color:#ff6b6f}

.c.f{background:color-mix(in srgb,var(--ch) 86%,var(--dg))}
.c{border-radius:calc(var(--cs)*var(--rad,.26))}
:root[data-skin="flat"]{--rad:.12}
:root[data-skin="flat"] .c{box-shadow:none}
:root[data-skin="round"]{--rad:.5}
:root[data-skin="ocean"] .c:not(.r):not(.f){background:color-mix(in srgb,var(--ch) 68%,#2f7df6)}
:root[data-skin="forest"] .c:not(.r):not(.f){background:color-mix(in srgb,var(--ch) 68%,#22a35a)}
:root[data-acc="green"]{--ac:#138a4a}

:root[data-acc="pink"]{--ac:#c2255c}
:root[data-acc="purple"]{--ac:#6741d9}

#sv{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--sf);color:var(--tx);width:100%;max-width:480px;max-height:86%;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--ln);padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,1,.4,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--sf);padding:14px 0 4px}

.opt{display:flex;flex-wrap:wrap;gap:6px}

</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="flag" viewBox="0 0 24 24"><path d="M6 21V3M3 21h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M6 4l13 5.5L6 15z" fill="#e5484d"/></symbol>
<symbol id="mine" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6.5" fill="currentColor"/><circle cx="10" cy="10" r="1.8" fill="#fff" opacity=".8"/></symbol>
<symbol id="clk" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4.5l3 1.5M9.5 2.5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

<header>

<label>Accent colour</label><div class="opt dots" data-k="acc"><button data-v="blue" style="--d:#3d6bff" aria-label="Blue"></button><button data-v="green" style="--d:#138a4a" aria-label="Green"></button><button data-v="orange" style="--d:#d9480f" aria-label="Orange"></button><button data-v="pink" style="--d:#c2255c" aria-label="Pink"></button><button data-v="purple" style="--d:#6741d9" aria-label="Purple"></button></div>

<script>
const APP_VERSION='2026.10.28-c';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const bw=$('#bw'),board=$('#board'),ov=$('#ov');
const LV={b:{r:9,c:9,m:10,n:'Beginner'},i:{r:16,c:16,m:40,n:'Intermediate'},e:{r:16,c:30,m:99,n:'Expert'}};
const FLAG='<svg><use href="#flag"/></svg>',MINE='<svg><use href="#mine"/></svg>';
let lv='b',mode='reveal',G,tmr,pt,lastPT,dp;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const VM=[0,.6,1,1.8];
const vib=p=>{try{const m=VM[S.vib|0];if(!m||!navigator.vibrate)return;navigator.vibrate(Array.isArray(p)?p.map(x=>Math.round(x*m)):Math.round(p*m))}catch(e){}};

/* ---------- PWA: theme colour, dynamic icons, inline manifest ---------- */
const theme=()=>{$('#tc').content=getComputedStyle(document.documentElement).getPropertyValue('--bar').trim()};
const mq=matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener&&mq.addEventListener('change',theme);theme();
function icon(s){
  const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),m=s/2;
  x.fillStyle='#181b22';x.fillRect(0,0,s,s);
  x.strokeStyle=x.fillStyle='#eef0f4';x.lineWidth=s*.05;x.lineCap='round';
  for(let a=0;a<4;a++){const t=a*Math.PI/4,d=s*.31;x.beginPath();x.moveTo(m+Math.cos(t)*d,m+Math.sin(t)*d);x.lineTo(m-Math.cos(t)*d,m-Math.sin(t)*d);x.stroke()}
  x.beginPath();x.arc(m,m,s*.2,0,7);x.fill();
  x.fillStyle='rgba(24,27,34,.45)';x.beginPath();x.arc(m-s*.07,m-s*.07,s*.05,0,7);x.fill();
  x.fillStyle='#e5484d';x.beginPath();x.arc(m+s*.27,m-s*.27,s*.07,0,7);x.fill();
  return c.toDataURL('image/png');
}
try{
  const bar=getComputedStyle(document.documentElement).getPropertyValue('--bar').trim();
  const mf={name:'Minesweeper',short_name:'Mines',start_url:location.href.split('#')[0],display:'standalone',orientation:'portrait',background_color:bar,theme_color:bar,
    icons:[{src:icon(192),sizes:'192x192',type:'image/png'},{src:icon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  $('#mf').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
  $('#ai').href=icon(180);
}catch(e){}

/* ---------- Add-to-Home-Screen banner ---------- */
const sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const showBan=()=>{if(!store.get('ms-ban'))$('#ban').classList.add('on')};
if(!sa){
  const ua=navigator.userAgent,ios=/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){$('#bt').innerHTML='Play full-screen: tap <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg> Share, then “Add to Home Screen”.';showBan()}
  else if(/Android/.test(ua)){$('#bt').textContent='Play full-screen: open the ⋮ menu, then “Add to Home screen” or “Install app”.';showBan()}
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#bt').textContent='Install Minesweeper for full-screen, app-like play.';$('#inst').hidden=false;showBan()});
$('#inst').onclick=()=>{dp&&dp.prompt();$('#ban').classList.remove('on')};
$('#x').onclick=()=>{$('#ban').classList.remove('on');store.set('ms-ban',1)};

/* ---------- Game logic ---------- */
const nb=i=>{const x=i%G.c,y=(i/G.c)|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<G.c&&b<G.r)o.push(b*G.c+a)}return o};

function newGame(){
  clearInterval(tmr);ov.hidden=true;
  const L=LV[lv],N=L.r*L.c;
  G={r:L.r,c:L.c,m:L.m,N,mine:Array(N).fill(0),adj:[],st:Array(N).fill(0),el:[],started:false,over:false,flags:0,rev:0,t0:0,t:0};
  board.textContent='';board.style.setProperty('--cols',G.c);
  const f=document.createDocumentFragment();
  for(let i=0;i<N;i++){const e=document.createElement('div');e.className='c';e.dataset.i=i;G.el.push(e);f.appendChild(e)}
  board.appendChild(f);bw.scrollTo(0,0);
  $('#face').textContent='🙂';$('#zm').hidden=lv==='b';zoom=lv==='b'?0:(+store.get('ms-z-'+lv)||0);zlab();tick();upd();prog();fit();
}
let zoom=0,T=false;
const ZF=[1,1.7,2.4];
const zlab=()=>{const z=$('#zm');z.textContent=zoom?'🔍 '+ZF[zoom]+'×':'🔍';z.classList.toggle('on',zoom>0)};
function setZoom(z){
  const o=parseFloat(board.style.getPropertyValue('--cs'))||1,cx=bw.scrollLeft+bw.clientWidth/2,cy=bw.scrollTop+bw.clientHeight/2;
  zoom=z;store.set('ms-z-'+lv,z);zlab();fit();
  const k=(parseFloat(board.style.getPropertyValue('--cs'))||1)/o;
  bw.scrollLeft=cx*k-bw.clientWidth/2;bw.scrollTop=cy*k-bw.clientHeight/2;
}
function fit(){
  const g=2,w=bw.clientWidth-24,h=bw.clientHeight-28;
  const t=lv==='e'&&bw.clientHeight>bw.clientWidth;
  if(t!==T||!G.laid){
    T=t;G.laid=1;
    G.el.forEach((e,i)=>{if(T){e.style.gridRow=(i%G.c)+1;e.style.gridColumn=((i/G.c)|0)+1}else{e.style.gridRow=e.style.gridColumn=''}});
  }
  const c=T?G.r:G.c,r=T?G.c:G.r;
  board.style.setProperty('--cols',c);
  let cs=Math.floor(Math.min((w-g*(c-1))/c,(h-g*(r-1))/r,48));
  if(zoom)cs=Math.min(56,Math.round(cs*ZF[zoom]));
  board.style.setProperty('--cs',Math.max(cs,16)+'px');
}
function tick(){
  G.t=G.started?Math.min(999,Math.floor((Date.now()-G.t0)/1000)):0;
  $('#tm').textContent=String(G.t).padStart(3,'0');
}
const prog=()=>{$('#pg i').style.width=(G.rev/(G.N-G.m)*100)+'%'};
function upd(){
  const v=G.m-G.flags;$('#mc').parentNode.classList.toggle('neg',v<0);
  $('#mc').textContent=(v<0?'-':'')+String(Math.abs(v)).padStart(v<0?2:3,'0');
}
function solve(f,mine,adj,NB){
  const N=G.N,st=new Int8Array(N);let rev=0;
  const open=i=>{const s=[i];while(s.length){const k=s.pop();if(st[k])continue;st[k]=1;rev++;if(!adj[k])for(const j of NB[k])if(!st[j])s.push(j)}};
  open(f);
  let prog=true;
  while(prog){
    prog=false;const cons=[];
    for(let i=0;i<N;i++)if(st[i]===1&&adj[i]){
      const unk=[];let m=0;
      for(const j of NB[i]){if(st[j]===2)m++;else if(st[j]===0)unk.push(j)}
      if(!unk.length)continue;
      const r=adj[i]-m;
      if(r===0){unk.forEach(open);prog=true}
      else if(r===unk.length){unk.forEach(j=>{st[j]=2});prog=true}
      else cons.push([unk,r]);
    }
    if(prog)continue;
    for(let a=0;a<cons.length&&!prog;a++)for(let b=0;b<cons.length&&!prog;b++){
      const[A,ra]=cons[a],[B,rb]=cons[b];
      if(a===b||A.length>=B.length||!B.includes(A[0])||!A.every(x=>B.includes(x)))continue;
      const D=B.filter(x=>!A.includes(x)),rd=rb-ra;
      if(rd===0){D.forEach(open);prog=true}
      else if(rd===D.length){D.forEach(j=>{st[j]=2});prog=true}
    }
  }
  return rev/(N-G.m);
}
function place(f){
  const NB=Array.from({length:G.N},(_,i)=>nb(i));
  const safe=new Set([f,...NB[f]]),pool=[];
  for(let i=0;i<G.N;i++)if(!safe.has(i))pool.push(i);
  const gen=()=>{
    const p=pool.slice(),mine=Array(G.N).fill(0);
    for(let k=0;k<G.m;k++){const j=k+Math.floor(Math.random()*(p.length-k));[p[k],p[j]]=[p[j],p[k]];mine[p[k]]=1}
    return{mine,adj:mine.map((_,i)=>NB[i].reduce((a,j)=>a+mine[j],0))};
  };
  let best=gen();
  if(S.gf==='on'){
    const end=Date.now()+(G.N>300?900:500);
    let bs=solve(f,best.mine,best.adj,NB);
    while(bs<1&&Date.now()<end){const c=gen(),s=solve(f,c.mine,c.adj,NB);if(s>bs){best=c;bs=s}}
  }
  G.mine=best.mine;G.adj=best.adj;
}
function draw(k){
  const e=G.el[k],s=G.st[k];
  if(s===1){e.className='c r'+(G.adj[k]?' n'+G.adj[k]:'');e.textContent=G.adj[k]||''}
  else if(s===2){e.className='c f';e.innerHTML=FLAG}
  else{e.className='c';e.innerHTML=''}
}
function reveal(i){
  if(G.over||G.st[i])return;
  if(!G.started){G.started=true;place(i);G.t0=Date.now();tmr=setInterval(tick,500)}
  if(G.mine[i])return lose(i);
  const stack=[i];
  while(stack.length){
    const k=stack.pop();if(G.st[k])continue;
    G.st[k]=1;G.rev++;draw(k);
    if(!G.adj[k])for(const j of nb(k))if(!G.st[j])stack.push(j);
  }
  vib(8);prog();
  if(G.rev===G.N-G.m)win();
}
function flag(i){
  if(G.over||G.st[i]===1)return;
  if(G.st[i]===2){G.st[i]=0;G.flags--}else{G.st[i]=2;G.flags++}
  draw(i);upd();vib(15);
}
function chord(i){
  if(G.over||!G.adj[i])return;
  const n=nb(i);
  if(n.filter(j=>G.st[j]===2).length!==G.adj[i]){vib(5);return}
  n.forEach(j=>{if(G.st[j]===0)reveal(j)});
}
function act(i,alt){
  if(G.over)return;
  if(G.st[i]===1)return S.chord==='on'?chord(i):0;
  if((mode==='flag')!==alt)flag(i);else if(G.st[i]!==2)reveal(i);
}
function lose(i){
  G.over=true;clearInterval(tmr);tick();
  for(let k=0;k<G.N;k++){
    const e=G.el[k];
    if(G.mine[k]&&G.st[k]!==2){e.className='c r m'+(k===i?' hit':'');e.innerHTML=MINE;if(k!==i)e.style.animationDelay=Math.random()*450+'ms'}
    else if(!G.mine[k]&&G.st[k]===2){e.className='c r x';e.textContent='✕'}
  }
  $('#face').textContent='😵';vib([60,40,140]);
  setTimeout(()=>modal(false),850);
}
function win(){
  G.over=true;clearInterval(tmr);tick();
  for(let k=0;k<G.N;k++)if(G.mine[k]&&G.st[k]!==2){G.st[k]=2;draw(k)}
  G.flags=G.m;upd();$('#face').textContent='😎';vib([30,50,30,50,90]);
  setTimeout(()=>modal(true),650);
}
function modal(w){
  let b=+store.get('ms-best-'+lv)||0,fresh=false;
  if(w&&(!b||G.t<b)){fresh=!!b||true;b=G.t;store.set('ms-best-'+lv,b)}
  $('#mi').textContent=w?'🎉':'💥';
  $('#mt').textContent=w?'You cleared the field!':'Boom!';
  $('#ms').textContent=LV[lv].n+' · '+(w?(fresh?'new best time!':'all mines found'):'you hit a mine');
  $('#s1').textContent=G.t+'s';
  $('#s2').textContent=Math.round(G.rev/(G.N-G.m)*100)+'%';
  $('#s3').textContent=b?b+'s':'–';
  ov.hidden=false;
}

/* ---------- Input: tap, long-press, right-click ---------- */
const cancelPt=()=>{if(pt){clearTimeout(pt.timer);pt=null}};
board.addEventListener('pointerdown',e=>{
  lastPT=e.pointerType;
  if(e.button>0)return;
  const el=e.target.closest('.c');if(!el)return;
  const p=pt={i:+el.dataset.i,x:e.clientX,y:e.clientY,long:false};
  p.timer=setTimeout(()=>{if(pt===p){p.long=true;vib(25);act(p.i,true)}},+S.lp);
});
board.addEventListener('pointermove',e=>{if(pt&&Math.hypot(e.clientX-pt.x,e.clientY-pt.y)>10)cancelPt()});
board.addEventListener('pointerup',e=>{
  if(!pt)return;const p=pt;clearTimeout(p.timer);pt=null;
  if(!p.long)act(p.i,false);
});
board.addEventListener('pointercancel',cancelPt);
board.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')cancelPt()});
board.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const el=e.target.closest('.c');
  if(el&&lastPT==='mouse')act(+el.dataset.i,true);
});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- UI wiring ---------- */
$$('.lv button').forEach(b=>b.onclick=()=>{
  lv=b.dataset.l;$$('.lv button').forEach(x=>x.classList.toggle('on',x===b));vib(8);newGame();
});
$$('.seg button[data-m]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;$('.seg').dataset.mode=mode;document.body.dataset.mode=mode;$$('.seg button[data-m]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});vib(8);
});
$('#face').onclick=newGame;
$('#again').onclick=newGame;
$('#close').onclick=()=>{ov.hidden=true};
$('#zm').onclick=()=>setZoom((zoom+1)%3);
const TH=['auto','light','dark'],THI=['◐','☀️','🌙'];
const DEF={th:'auto',acc:'blue',skin:'soft',vib:'2',lp:'380',chord:'on',anim:'on',gf:'on'};
let S;
try{S=Object.assign({},DEF,JSON.parse(store.get('ms-set')||'{}'))}catch(e){S=Object.assign({},DEF)}
const GEAR='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
function applySet(){
  const d=document.documentElement;
  if(S.th==='auto')d.removeAttribute('data-theme');else d.dataset.theme=S.th;
  d.dataset.acc=S.acc;d.dataset.skin=S.skin;d.dataset.anim=S.anim;
  $$('#sv .opt').forEach(o=>o.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.v===S[o.dataset.k])));
  theme();
}
$('#th').innerHTML=GEAR;
$('#th').onclick=()=>{$('#sv').hidden=false;vib(8)};
$('#sx').onclick=()=>{$('#sv').hidden=true};
$('#sv').addEventListener('click',e=>{if(e.target.id==='sv')e.target.hidden=true});
$$('#sv .opt button').forEach(b=>b.onclick=()=>{S[b.parentNode.dataset.k]=b.dataset.v;store.set('ms-set',JSON.stringify(S));applySet();vib(20)});
$('#rb').onclick=()=>{['b','i','e'].forEach(k=>store.set('ms-best-'+k,''));vib(20);$('#rb').textContent='Best times cleared'};
$('#ver').textContent='Version '+APP_VERSION;
async function checkUpdate(manual){
  try{
    const r=await fetch(location.pathname+'?nocache='+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(/APP_VERSION='([0-9][^']*)'/);
    if(m&&m[1]!==APP_VERSION){location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));return}
    if(manual)$('#up').textContent='You have the latest version';
  }catch(e){if(manual)$('#up').textContent='Offline – try again later'}
}
$('#up').onclick=()=>{$('#up').textContent='Checking…';checkUpdate(true)};
addEventListener('load',()=>setTimeout(checkUpdate,1500));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)clearInterval(tmr);
  else if(G&&G.started&&!G.over){clearInterval(tmr);tmr=setInterval(tick,500)}
